  // Each published index contains exactly one student's site.
  text=text.replace(/<a data-r88-gallery="1"[\s\S]*?<\/a>/,'');
  text=text.replace('Vista navegable · no guarda datos','Ejercicio de clase · no guarda datos');
  data=text;
 }
 return blobCache[path]=URL.createObjectURL(new Blob([data],{type:asset.type+';charset=utf-8'}));
}
function documentFor(route){
 const base='https://local.invalid/'+meta.site+'/'+meta.pages[route];
 const doc=new DOMParser().parseFromString(PACK.pages[meta.site+route],'text/html');
 const first=doc.createElement('script');first.textContent='window.R88_EMBEDDED=true;';doc.head.prepend(first);
 for(const tag of doc.querySelectorAll('script[src],link[href],img[src],source[src]')){
  const attr=tag.tagName==='LINK'?'href':'src',value=tag.getAttribute(attr);
  if(!value||/^(data:|blob:|https?:|#)/i.test(value))continue;
  const path=decodeURIComponent(new URL(value,base).pathname.slice(1));
  const resolved=assetURL(path);if(resolved)tag.setAttribute(attr,resolved);
 }
 for(const tag of doc.querySelectorAll('a[href^="http"]')){tag.target='_blank';tag.rel='noopener noreferrer';}
 const localStyle=doc.createElement('style');
 localStyle.textContent='.r88-localbar [data-r88-gallery]{display:none!important}';
 doc.head.appendChild(localStyle);
 const done=doc.createElement('script');
 done.textContent="window.addEventListener('load',()=>setTimeout(()=>parent.postMessage({type:'r88-ready',site:window.R88_OFFLINE.site,route:window.R88_OFFLINE.route},'*'),60));";
 doc.body.appendChild(done);
 return '<!doctype html>'+doc.documentElement.outerHTML;
}
function normalizeRoute(route){
 if(meta.pages[route])return route;
 let pathname=String(route||'/').split('#')[0].split('?')[0];
 if(!pathname.startsWith('/'))pathname='/'+pathname;
 if(pathname.endsWith('/index.html'))pathname=pathname.slice(0,-10);
 if(!pathname.endsWith('/'))pathname+='/';
 return meta.pages[pathname]?pathname:'/mapa/';
}
function show(route){
 route=normalizeRoute(route);currentRoute=route;section.value=route;
 loading.hidden=false;frame.setAttribute('aria-busy','true');
 document.title=(meta.titles[route]||'Proyecto')+' · '+meta.brand;
 frame.srcdoc=documentFor(route);
}
function open(route='/'){
 route=normalizeRoute(route);const hash='#pagina='+encodeURIComponent(route);
 if(location.hash===hash)show(route);else location.hash=hash;
}
function onHash(){
 const params=new URLSearchParams(location.hash.slice(1));
 show(params.get('pagina')||'/');
}
for(const route of Object.keys(meta.pages)){
 const option=document.createElement('option');option.value=route;
 option.textContent=(meta.titles[route]||route);
 section.appendChild(option);
}
section.addEventListener('change',()=>open(section.value));
document.getElementById('home').addEventListener('click',()=>open('/'));
document.getElementById('panel').addEventListener('click',()=>open(meta.panel||'/'));
window.addEventListener('hashchange',onHash);
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow)return;
 const data=event.data||{};if(data.site&&data.site!==meta.site)return;
 if(data.type==='r88-nav')open(data.route);
 else if(data.type==='r88-gallery')open('/');
 else if(data.type==='r88-ready'&&data.route===currentRoute){loading.hidden=true;frame.setAttribute('aria-busy','false');}
});
onHash();
</script>
<style>

<button id="huella-chat-launcher" type="button" aria-expanded="false" aria-controls="huella-chat"><span aria-hidden="true">🐾</span> Pregúntale a Huella</button>
<section id="huella-chat" aria-label="Chat de Huella" data-open="false">
 <header class="hc-head"><div class="hc-brand"><span class="hc-paw" aria-hidden="true">🐾</span><span><strong>Asistente Huella</strong><small>Respuestas basadas en este sitio</small></span></div><button class="hc-close" type="button" aria-label="Cerrar chat">×</button></header>
 <div class="hc-messages" id="hc-messages" aria-live="polite"></div>
 <div class="hc-suggestions" id="hc-suggestions"><button type="button">¿Qué servicios ofrecen?</button><button type="button">¿Cómo agendo una cita?</button><button type="button">¿Cómo cancelo mi cita?</button></div>
 <form class="hc-form" id="hc-form"><input id="hc-input" aria-label="Escribe tu pregunta" placeholder="Escribe tu pregunta…" autocomplete="off" maxlength="500" required><button type="submit">Enviar</button></form><div class="hc-note">Consulta informativa · No sustituye la atención veterinaria</div>
</section>
<script>
(()=>{
 const launcher=document.getElementById('huella-chat-launcher'),panel=document.getElementById('huella-chat'),messages=document.getElementById('hc-messages'),form=document.getElementById('hc-form'),input=document.getElementById('hc-input'),close=panel.querySelector('.hc-close');
 const meta=PACK.sites[0], stop=new Set('a al algo algunas algunos ante como con cual cuando de del desde donde dos el ella ellas ellos en entre era es esa esas ese eso esos esta estaba estado estas este esto estos fue ha han hasta hay la las le les lo los más me mi mis mucha muchas mucho muchos muy no nos o para pero por porque que se sin sobre su sus te tiene tienen todo todos tras tu tus un una uno unas unos y ya'.split(' '));
 const norm=s=>String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ]+/g,' ').trim();
 const corpus=[];
 for(const [route,rel] of Object.entries(meta.pages)){
  const source=PACK.pages[meta.site+route];if(!source)continue;
  const doc=new DOMParser().parseFromString(source,'text/html');
  doc.querySelectorAll('script,style,noscript,svg').forEach(n=>n.remove());
  const chunks=[];
  const title=meta.titles[route]||doc.title||route;
  chunks.push(title);
  const nodes=doc.querySelectorAll('h1,h2,h3,h4,p,li,summary,label,th,td,button,legend,.notice,.eyebrow');
  for(const node of nodes){const t=(node.textContent||'').replace(/\s+/g,' ').trim();if(t.length>=18&&t.length<=700&&!chunks.includes(t))chunks.push(t)}
  const whole=(doc.body?.textContent||'').replace(/\s+/g,' ').trim();
  for(const sentence of whole.split(/(?<=[.!?])\s+/)){const t=sentence.trim();if(t.length>=35&&t.length<=450&&!chunks.includes(t))chunks.push(t)}
  for(const text of chunks)corpus.push({route,title,text,tokens:norm(text).split(/\s+/).filter(w=>w.length>2&&!stop.has(w))});
 }
 function addMessage(text,who='bot',sources=[]){
  const bubble=document.createElement('div');bubble.className='hc-message '+who;bubble.textContent=text;
  if(sources.length){const links=document.createElement('div');links.className='hc-sources';for(const route of [...new Set(sources)].slice(0,3)){const b=document.createElement('button');b.type='button';b.className='hc-source';b.textContent=meta.titles[route]||route;b.addEventListener('click',()=>{open(route);panel.dataset.open='false';launcher.setAttribute('aria-expanded','false')});links.appendChild(b)}bubble.appendChild(links)}
  messages.appendChild(bubble);messages.scrollTop=messages.scrollHeight;
 }
 function answer(question){
  const q=norm(question),terms=[...new Set(q.split(/\s+/).filter(w=>w.length>2&&!stop.has(w)))];
  if(/^(hola|buenas|buenos dias|buenas tardes|buenas noches|gracias|ayuda)$/.test(q)){addMessage('¡Hola! Puedo ayudarte con la información de Huella: servicios, citas, horarios, privacidad y las secciones del sitio. ¿Qué quieres saber?');return}
  if(!terms.length){addMessage('Cuéntame un poco más para buscarlo en la información del sitio. Por ejemplo: servicios, reservar una cita o cancelar.');return}
  const scored=corpus.map(item=>{let score=0;for(const term of terms){const count=item.tokens.filter(t=>t===term).length;if(count)score+=1+Math.min(count-1,3)*.25;if(item.tokens.some(t=>t.startsWith(term)&&t!==term))score+=.22}if(item.text.toLocaleLowerCase('es').includes(question.toLocaleLowerCase('es').trim()))score+=3;return {...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  if(!scored.length||scored[0].score<1.15){addMessage('No encuentro esa información en las páginas disponibles de Huella. Puedes preguntarme sobre servicios, reservas, cancelaciones, horarios, insumos o las secciones del sitio.');return}
  const top=scored.slice(0,8), chosen=[];for(const item of top){if(chosen.length>=3)break;if(!chosen.some(x=>x.route===item.route))chosen.push(item)}
  const lines=chosen.map(x=>x.text);const distinctRoutes=chosen.map(x=>x.route);
  addMessage(lines.join('\n\n'), 'bot', distinctRoutes);
 }
 function submit(question){const q=String(question||'').trim();if(!q)return;addMessage(q,'user');input.value='';answer(q)}
 launcher.addEventListener('click',()=>{const show=panel.dataset.open!=='true';panel.dataset.open=String(show);launcher.setAttribute('aria-expanded',String(show));if(show){if(!messages.children.length)addMessage(`¡Hola! Soy el asistente de Huella. Ya consulté el contenido de ${Object.keys(meta.pages).length} páginas del sitio. ¿Qué te gustaría saber?`);input.focus()}});
 close.addEventListener('click',()=>{panel.dataset.open='false';launcher.setAttribute('aria-expanded','false');launcher.focus()});
 form.addEventListener('submit',e=>{e.preventDefault();submit(input.value)});
 document.getElementById('hc-suggestions').addEventListener('click',e=>{if(e.target.tagName==='BUTTON')submit(e.target.textContent)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.dataset.open==='true'){panel.dataset.open='false';launcher.setAttribute('aria-expanded','false');launcher.focus()}});
})();
</script></body></html>
